name: Hugo build and deploy
on:
  push:
    branches: [main, "migration/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # 0.146 introduced layouts/_partials/ support; 0.159.2 is what was used
  # to verify the migration locally.
  HUGO_VERSION: "0.159.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo (extended)
        run: |
          curl -fsSL -o /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm deps for the Materials Network bundle
        run: npm ci --no-audit --no-fund
        # Cytoscape + cytoscape-fcose are imported by assets/js/network/main.js
        # and bundled by Hugo's js.Build (esbuild). package-lock.json pins
        # the versions; node_modules/ is gitignored.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps for placeholder generators + gates
        run: pip install pyyaml reportlab pypdf python-pptx Pillow pypdfium2 certifi

      - name: Install LibreOffice (headless, for .pptx -> .pdf rendering)
        # GitHub-hosted Ubuntu runners typically include LibreOffice;
        # this guarantees it. -y flag, --no-install-recommends keeps
        # the install lean (no Java GUI bits).
        run: |
          if ! command -v soffice >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libreoffice-impress libreoffice-core
          fi
          soffice --version

      - name: Hugo Modules tidy + verify
        run: |
          hugo mod tidy
          hugo mod verify

      - name: Generate placeholder worksheets, presentations + thumbnails
        run: |
          python _scripts/make_placeholder_worksheets.py --out static/downloads
          python _scripts/make_placeholder_presentations.py
          python _scripts/make_placeholder_thumbnails.py

      - name: Populate Materials Network frontmatter (tags + topic)
        # Idempotent. Safe to run on every build; ensures tags/topic
        # never drift from the bildungsplan + skills_focus source of truth.
        run: python _scripts/populate_network_frontmatter.py

      - name: Verify Plausible snippet is wired
        run: |
          test -f layouts/_partials/head/extensions.html
          grep -q 'data-domain="boulingua.github.io/efl"' layouts/_partials/head/extensions.html
          grep -q 'analytics.hellebo.de' layouts/_partials/head/extensions.html

      - name: Build site
        run: hugo --minify --gc

      - name: Build Pagefind search index
        # Indexes public/ in place. Generates public/pagefind/pagefind.js
        # and a sharded index that the search.js module loads on first
        # keystroke.
        run: npx pagefind --site public

      - name: Verify Plausible appears in rendered home page
        run: |
          test -f public/index.html
          # Hugo's HTML minifier may strip the quotes around attribute values,
          # so accept both quoted and bare forms.
          grep -qE 'data-domain="?boulingua\.github\.io/efl"?' public/index.html

      - name: Verify VG Wort manifest survived migration
        run: python _scripts/verify_all_pixels.py

      - name: Verify VG Wort pixels in rendered HTML
        run: python _scripts/verify_rendered_pixels.py

      - name: Verify URL parity vs deployed Quarto sitemap
        # Reports only — slide-deck URLs are documented Quarto-only outputs
        # (Phase 0 §8 decision 1) and not regenerated by Hugo. Tighten to
        # blocking once an external slide pipeline is wired.
        continue-on-error: true
        run: python _scripts/verify_url_parity.py

      - name: Verify zero broken internal links
        run: python _scripts/verify_internal_links.py

      - name: Verify Materials Network gates (graph.json + topics + pagefind)
        run: python _scripts/verify_graph.py

      - name: Validate network-viz data schema (Phase 2)
        run: python scripts/validate_network_data.py

      - name: Verify network JS bundle budget
        run: python _scripts/verify_bundle_budget.py

      - name: Verify every material download + thumbnail URL resolves
        run: python _scripts/verify_downloads.py

      - name: Verify Plausible + VG Wort tracking on /materials/ + unit page
        run: python _scripts/verify_tracking.py

      - name: VG Wort Mindestumfang coverage (warning)
        # Lists long-form pages over 1800 chars without a Zählmarke. Not
        # blocking — registration is async via the VG Wort T.O.M. portal.
        continue-on-error: true
        run: python _scripts/verify_vgwort_coverage.py

      - name: Phase 6.1 — Impressum / Datenschutz placeholder check
        run: python _scripts/verify_legal_placeholders.py

      - name: Phase 6.2 — Bildungsplan BW live-fetch
        run: python _scripts/verify_bildungsplan_refs.py

      - name: Phase 6.6 — PDF attribution audit
        run: python _scripts/verify_pdf_attribution.py

      - name: Phase 6.7 — Author attribution gate
        run: python _scripts/verify_author_attribution.py

      - name: Lychee external link check (informational)
        # Catches broken external links and HTTP redirects. Non-blocking
        # initially; tighten once a baseline is established.
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --timeout 20
            --accept 200,204,206,301,302,308,403
            --exclude-path public/HANDOVER.html
            --exclude-path public/LEGAL.html
            'public/**/*.html'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    # Only deploy from main; migration branches build only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
