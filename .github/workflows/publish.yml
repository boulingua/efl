name: Render and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml pandas jupyter reportlab pypdf
      - uses: actions/cache@v4
        with:
          path: _freeze
          key: ${{ runner.os }}-quarto-freeze-${{ hashFiles('**/*.qmd') }}
          restore-keys: ${{ runner.os }}-quarto-freeze-
      - name: Generate placeholder worksheet PDFs
        run: python _scripts/make_placeholder_worksheets.py
      - name: Render site (HTML Units + Reveal.js decks + exam PDFs)
        run: quarto render
      - name: Organise exam PDFs into canonical paths
        run: bash _scripts/organise_downloads.sh
      - name: Verify expected PDFs exist (skipped while units are stubs)
        run: |
          EXAMS=$(find docs/downloads -name "*_exam.pdf" 2>/dev/null | wc -l)
          WORKS=$(find docs/downloads -name "*_worksheet.pdf" 2>/dev/null | wc -l)
          echo "Exam PDFs: $EXAMS"
          echo "Worksheet PDFs: $WORKS"
          # Hard gate (180/180) is enabled once Phase 4 completes.
          # During scaffolding, only the audit gate runs against whatever PDFs exist.
      - name: Verify every PDF attributes S. Le Boulanger
        run: |
          python - <<'PY'
          import sys, pathlib
          from pypdf import PdfReader
          bad = []
          pdfs = list(pathlib.Path('docs/downloads').rglob('*.pdf'))
          for p in pdfs:
              try:
                  r = PdfReader(str(p))
                  author = (r.metadata or {}).get('/Author', '') or ''
              except Exception as e:
                  bad.append(f"{p} (read error: {e})")
                  continue
              if 'Le Boulanger' not in author:
                  bad.append(str(p))
          if bad:
              print('MISSING ATTRIBUTION:', *bad, sep='\n')
              sys.exit(1)
          print(f'All {len(pdfs)} PDFs attributed to S. Le Boulanger.')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
