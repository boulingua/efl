baseURL = "https://boulingua.github.io/efl/"
title = "EFL"
languageCode = "en"
defaultContentLanguage = "en"
enableEmoji = false
enableRobotsTXT = true

publishDir = "public"

[pagination]
  pagerSize = 20

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

# Phase 5 — Materials Discovery Network. Custom output format that
# emits a JSON-Graph artefact at /materials/graph.json on every build.
# The /materials/_index.md page sets `outputs: ["html", "network"]`.
[outputFormats.network]
  mediaType = "application/json"
  baseName = "graph"
  isPlainText = true
  notAlternative = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

[params]
  code = "efl"
  license = "CC BY-SA 4.0"
  font_preload = [
    "fonts/source-sans-3-v19-latin_latin-ext-regular.woff2",
    "fonts/jetbrains-mono-v24-latin_latin-ext-regular.woff2",
  ]
  author = "S. Le Boulanger"
  description = "A two-track English curriculum for comprehensive school, grades 5 to 13, aligned to a regional curriculum framework."
  keywords = "EFL,English,curriculum,Bildungsplan,Baden-Württemberg,OER,CEFR,Gesamtschule"
  info = ["EFL", "Two-track English curriculum", "Klassen 5–13"]
  # avatarURL intentionally unset until a real avatar lands under
  # static/images/. Coder skips the home-page avatar block when this
  # param is empty, avoiding a 404 reference on /index.html.
  dateFormat = "2006-01-02"
  hideFooter = false
  hideCredits = true
  since = 2025
  colorScheme = "auto"
  # Disable the theme's floating colour-scheme toggle so the navbar
  # #dark-mode-toggle button is the single, unique toggle element.
  hideColorSchemeToggle = true
  # tokens.css and custom.css arrive from the kit; course.css holds only
  # what is efl's own and layers on top.
  customCSS = ["css/tokens.css", "css/custom.css", "css/course.css"]
  faviconSVG = ""

# Plausible Analytics — self-hosted instance (server in Germany,
# DSGVO-compliant disclosure already in /datenschutz/). Each sister
# site configures its own data-domain so cross-site visits are
# counted as separate properties.
[params.plausible]
  domain = "boulingua.github.io/efl"
  # script.file-downloads.outbound-links.js: Plausible variant that
  # additionally tracks .pdf/.pptx/.png downloads and outbound link
  # clicks. The Ressourcen-Hub-style worksheet links are the
  # primary thing we care to count for VG Wort planning, so this
  # explicit override of the prompt's "no outbound tracking by
  # default" stance is intentional and disclosed in /datenschutz/.
  # Switch to "script.js" for the cookieless / no-outbound default.
  src = "https://analytics.hellebo.de/js/script.file-downloads.outbound-links.js"

# Match the reference repo (boulingua/website) social link for visual continuity.
[[params.social]]
  name = "GitHub"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/boulingua/efl"

