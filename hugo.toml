# ----- Hugo Modules: pin hugo-coder identical to reference repo -----

[module]
  # First match wins in listed order, so the kit must precede hugo-coder to
  # override it. Listed after, the theme's own body/extensions.html and
  # head/extensions.html stubs win, the kit is never reached, and every VG Wort
  # pixel leaves the site on a green build.
  [[module.imports]]
    path = "github.com/boulingua/kit"
  [[module.imports]]
    path = "github.com/luizdepra/hugo-coder"

