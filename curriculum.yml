# Conformance manifest — boulingua/efl.
#
# Two fields, because they are two facts. `declared_conformance` is the TARGET;
# `conformance_status` is whether it has been reached. Collapsing them makes
# "aiming at core and not there yet" indistinguishable from a lesser target,
# and a course does not aim at partial.
#
# This course is IN-PROGRESS and will stay so while any page carries
# implements_basis: proposed. The structure of those claims is verified — every
# id resolves at the page's own level, no two share a scale, and the breadth
# rule holds — but the judgement behind them is a machine ranking, not a
# reading of the unit. Confirming a tranche means changing that field, and the
# count below is what tells you how much is left.

framework: boulingua-curriculum
framework_version: 1.1.0
language: en
declared_conformance: full
conformance_status: in-progress

levels_claimed: [A1, A2, B1, B2]

# Pages by level, measured from the content rather than declared here.
pages:
  A1: 96
  A2: 144
  B1: 48
  B2: 72

implements:
  distinct_descriptors: 280
  proposed: 360
  asserted: 0

